function guardarFotoMomento(){
 const input=document.createElement('input'); input.type='file'; input.accept='image/*';
 input.onchange=e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{
   const novo={id:Date.now(), titulo:sugestaoAtual.titulo.replace(/^[^\s]+\s/,'').slice(0,40), desc:"Momento vivido: "+sugestaoAtual.desc, data:new Date().toLocaleDateString(), foto:ev.target.result, coracao:true};
   momentos.unshift(novo); localStorage.setItem('momentos',JSON.stringify(momentos));
   atualizarCoracoes();
   finalizarMomentoComMensagem("Foto guardada em Nossos Momentos! 📸");
  };
  r.readAsDataURL(file);
 };
 input.click();
}

function atualizarCoracoes(){
 coracoes = Math.min(5, (parseInt(localStorage.getItem('coracoesPresenca')||'0')+1));
 if(coracoes>=5){

   }, 500);
   coracoes=0;
 }
 localStorage.setItem('coracoesPresenca', coracoes.toString());
}

function salvarMomento(){
  try{
    const titEl=document.getElementById('tit');
    const descEl=document.getElementById('desc');
    const fileInput=document.getElementById('fotoInput');
    const tit=titEl?titEl.value||'Momento':'Momento';
    const desc=descEl?descEl.value||'':'';
    const file=fileInput && fileInput.files ? fileInput.files[0] : null;
    if(file){
      if(file.size>5*1024*1024){ alert('Foto muito grande. Use até 5MB.'); return; }
      const r=new FileReader();
      r.onload=e=>{
        try{
          momentos.unshift({id:Date.now(), titulo:tit, desc, data:new Date().toLocaleDateString(), foto:e.target.result});
          localStorage.setItem('momentos',JSON.stringify(momentos));
          atualizarCoracoes();
          nav('momentos');
        }catch(err){ alert('Erro ao salvar: memória cheia. Tente foto menor.'); }
      };
      r.onerror=()=>{ alert('Erro ao ler foto. Tente outra.'); };
      r.readAsDataURL(file);
    }else{
      momentos.unshift({id:Date.now(), titulo:tit, desc, data:new Date().toLocaleDateString(), foto:''});
      localStorage.setItem('momentos',JSON.stringify(momentos));
      atualizarCoracoes();
      nav('momentos');
    }
  }catch(err){ alert('Erro: '+err.message); }
}

// === MICROFONE CORRIGIDO 100% - SEM REPETIR ===
let ultimoTextoCapturado='';
let tempoUltimaCaptura=0;
function toggleMic(){
 if(isListening){cancelarMic(); return;}
 isListening=true;
 document.getElementById('micModal').classList.remove('hidden');
 const live=document.getElementById('liveText');
 live.innerText="Ouvindo... pode falar...";
 let finalCaptured='';
 try{
  const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Rec){
    alert('Seu navegador não suporta microfone. Digite o lembrete. No Chrome funciona 100%.');
    isListening=false;
    document.getElementById('micModal').classList.add('hidden');
    return;
  }
  const rec=new Rec();
  rec.lang='pt-BR';
  rec.continuous=false;
  rec.interimResults=false;
  rec.maxAlternatives=1;
  window.recInstance=rec;
  
  rec.onresult=(e)=>{
    const t=e.results[0][0].transcript.trim();
    const agora=Date.now();
    // Evita repetir mesma frase em menos de 2 segundos
    if(e.results[0].isFinal && t && t!==finalCaptured && !(t===ultimoTextoCapturado && (agora-tempoUltimaCaptura)<2000)){
      finalCaptured=t;
      ultimoTextoCapturado=t;
      tempoUltimaCaptura=agora;
      live.innerText=t;
      live.classList.add('bg-[#EAF4ED]');
    }
  };
  rec.onend=()=>{
    isListening=false;
    document.getElementById('micModal').classList.add('hidden');
    if(finalCaptured){
      const inputEl=document.getElementById('lembreInput');
      if(inputEl){
        // Só adiciona se for diferente do que já tem, evita duplicar
        if(inputEl.value.trim()!==finalCaptured){
          inputEl.value=finalCaptured;
          localStorage.setItem('lastInput',finalCaptured);
        }
      }
    }
  };
  rec.onerror=(e)=>{
    console.log('Mic error', e.error);
    isListening=false;
    document.getElementById('micModal').classList.add('hidden');
    if(e.error==='not-allowed'){
      alert('Permissão de microfone negada. Vá em Configurações > Permitir microfone.');
    }
  };
  rec.start();
 }catch(err){
  isListening=false;
  document.getElementById('micModal').classList.add('hidden');
 }
}

function cancelarMic(){
 isListening=false;
 try{if(window.recInstance) window.recInstance.stop();}catch(e){}
 document.getElementById('micModal').classList.add('hidden');
}
function usarTexto(){
 const t=document.getElementById('liveText').innerText;
 if(t && t!=='Ouvindo... pode falar...'){
   document.getElementById('lembreInput').value=t;
   localStorage.setItem('lastInput',t);
 }
 cancelarMic();
}
function criarLembreteManual(){
 const texto=document.getElementById('lembreInput').value.trim();
 if(!texto){alert('Escreva seu lembrete ou use o microfone 🎙️'); return;}
 
 // Parse inteligente de data
 let dataHora=new Date();
 const txtLower=texto.toLowerCase();
 if(txtLower.includes('amanhã')){
   dataHora.setDate(dataHora.getDate()+1);
   // Tenta pegar hora se mencionar
   const horaMatch=texto.match(/(\d{1,2})h/);
   if(horaMatch){ dataHora.setHours(parseInt(horaMatch[1]),0,0,0); }
   else { dataHora.setHours(8,0,0,0); }
 } else if(txtLower.includes('hoje')){
   const horaMatch=texto.match(/(\d{1,2})h/);
   if(horaMatch){ dataHora.setHours(parseInt(horaMatch[1]),0,0,0); }
   else { dataHora.setMinutes(dataHora.getMinutes()+2); }
 } else {
   // Se não especificar, 1 minuto para teste
   dataHora.setMinutes(dataHora.getMinutes()+1);
 }
 
 const novo={id:Date.now(), titulo:texto, dataHora:dataHora.toISOString(), concluido:false, notificado:false};
 lembretes.unshift(novo);
 localStorage.setItem('lembretes',JSON.stringify(lembretes));
 localStorage.setItem('lastInput','');
 
 // Agenda notificação robusta
 agendarNotificacao(novo);
 
 // Feedback
 alert('✅ Lembrete criado!\n\n🕐 Vai tocar em: '+dataHora.toLocaleString('pt-BR')+'\n🔔 Mesmo com app fechado, você receberá notificação na barra do celular + som + vibração.\n\nDeixe as notificações ativas!');
 renderAgenda();
}

// === SISTEMA DE NOTIFICAÇÃO COM APP FECHADO - ROBUSTO ===
function agendarNotificacao(l){
 try{
  const agora=new Date();
  const quando=new Date(l.dataHora);
  const delay=quando-agora;
  if(delay<=0) return;
  
  console.log('Agendando notificação para', quando, 'em', Math.round(delay/1000), 'segundos');
  
  // Salva no localStorage para re-agendar ao abrir
  const agendamentos=JSON.parse(localStorage.getItem('agendamentos')||'[]');
  agendamentos.push({id:l.id, dataHora:l.dataHora, titulo:l.titulo});
  localStorage.setItem('agendamentos', JSON.stringify(agendamentos));
  
  // Timer principal
  setTimeout(()=>{
    dispararNotificacao(l);
  }, delay);
  
  // Também agenda via service worker se disponível
  if('serviceWorker' in navigator && navigator.serviceWorker.controller){
    try{
      navigator.serviceWorker.ready.then(reg=>{
        // Tenta usar showNotification direto
        console.log('Service Worker pronto para notificação');
      });
    }catch(e){}
  }
 }catch(e){ console.error('Erro agendar', e); }
}

function dispararNotificacao(l){
 try{
  // Evita duplicar
  if(l.notificado) return;
  l.notificado=true;
  
  // 1. Toca som alto
  tocarSomForte();
  
  // 2. Vibra
  if('vibrate' in navigator){
    navigator.vibrate([500,200,500,200,500,200,500]);
  }
  
  // 3. Notificação na barra (funciona mesmo com app fechado se permissão concedida)
  if(Notification.permission==='granted'){
    try{
      const n=new Notification('⏰ Lembre por Mim', {
        body:l.titulo,
        icon:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔔</text></svg>',
        badge:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔔</text></svg>',
        vibrate:[500,200,500,200,500],
        requireInteraction:true, // Fica até usuário clicar
        tag:'lembre-'+l.id,
        renotify:true,
        silent:false
      });
      n.onclick=function(){
        window.focus();
        this.close();
        nav('agenda');
        tocarSomForte();
      };
    }catch(e){ console.log('Notification error', e); }
    
    // Via service worker também (mais confiável para background)
    try{
      if(navigator.serviceWorker && navigator.serviceWorker.ready){
        navigator.serviceWorker.ready.then(reg=>{
          reg.showNotification('⏰ Lembre por Mim', {
            body:l.titulo,
            icon:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔔</text></svg>',
            vibrate:[500,200,500,200,500],
            requireInteraction:true,
            tag:'lembre-'+l.id,
            data:{id:l.id}
          });
        });
      }
    }catch(e){}
  } else {
    alert('🔔 LEMBRETE: '+l.titulo+'\n\nAtive as notificações para tocar com app fechado!');
  }
  
  // 4. Atualiza storage
  const idx=lembretes.findIndex(x=>x.id===l.id);
  if(idx>=0){
    lembretes[idx].notificado=true;
    localStorage.setItem('lembretes',JSON.stringify(lembretes));
  }
  
  // 5. Se estiver na tela, atualiza UI
  if(current==='agenda') renderAgenda();
  
 }catch(e){ console.error('Erro disparar', e); }
}

function tocarSomForte(){
 try{
  // Desbloqueia AudioContext no primeiro clique do usuário
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  const ctx=new AudioCtx();
  if(ctx.state==='suspended'){ ctx.resume(); }
  
  // Beep 880Hz forte, 3 vezes
  function beep(freq, duration, delay){
    setTimeout(()=>{
      const o=ctx.createOscillator();
      const g=ctx.createGain();
      o.type='sine';
      o.frequency.value=freq;
      o.connect(g);
      g.connect(ctx.destination);
      g.gain.setValueAtTime(0.9, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+duration/1000);
      o.start();
      setTimeout(()=>{try{o.stop();}catch(e){}}, duration);
    }, delay);
  }
  beep(880, 400, 0);
  beep(880, 400, 600);
  beep(880, 800, 1200);
  beep(1200, 600, 2000);
  
  // Voz
  setTimeout(()=>{
    if('speechSynthesis' in window){
      const u=new SpeechSynthesisUtterance('Lembrete: '+ (lembretes.find(x=>!x.concluido)?.titulo||'Hora de lembrar'));
      u.lang='pt-BR';
      u.rate=0.9;
      u.volume=1;
      speechSynthesis.speak(u);
    }
  }, 100);
  
  setTimeout(()=>{try{ctx.close();}catch(e){}}, 4000);
 }catch(e){ console.log('Audio error', e); }
}

// Desbloqueia áudio no primeiro toque (necessário para mobile)
let audioDesbloqueado=false;
function desbloquearAudio(){
 if(audioDesbloqueado) return;
 try{
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const o=ctx.createOscillator();
  const g=ctx.createGain();
  g.gain.value=0;
  o.connect(g); g.connect(ctx.destination);
  o.start(); o.stop();
  ctx.close();
  audioDesbloqueado=true;
  console.log('Áudio desbloqueado');
 }catch(e){}
}
document.addEventListener('click', desbloquearAudio, {once:true});
document.addEventListener('touchstart', desbloquearAudio, {once:true});
